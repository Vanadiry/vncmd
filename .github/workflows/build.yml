name: Build

permissions:
  contents: write

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: arm64
            label: macos
          - os: ubuntu-24.04
            arch: amd64
            label: linux
          - os: windows-latest
            arch: amd64
            label: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project
        run: uv sync --frozen

      - name: Install nuitka
        run: uv pip install nuitka

      - name: Build (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          uv run nuitka --standalone --onefile --output-dir=dist --output-filename=vncmd build_entry.py --include-package=vncmd --assume-yes-for-downloads

      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: |
          uv run nuitka --standalone --onefile --output-dir=dist --output-filename=vncmd build_entry.py --include-package=vncmd --msvc=latest --include-package-data=tzdata --assume-yes-for-downloads

      - name: Package binary
        shell: bash
        run: |
          V="${GITHUB_REF_NAME#v}"
          EXT=""
          [ "${{ matrix.label }}" = "windows" ] && EXT=".exe"
          mkdir -p release
          cp "dist/vncmd${EXT}" "release/vncmd-${V}-${{ matrix.label }}-${{ matrix.arch }}${EXT}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.label }}-${{ matrix.arch }}
          path: release/

  sdist:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.11"
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sdist
          path: dist/

  release:
    needs: [build, sdist]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Flatten artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "vncmd-*" -o -name "*.whl" -o -name "*.tar.gz" \) | while read f; do
            cp "$f" "release/$(basename "$f")"
          done

      - name: Extract changelog
        run: |
          V="${GITHUB_REF_NAME#v}"
          awk "/^## \[$V\]/{p=1; next} /^## \[/{p=0} p" CHANGELOG.md > /tmp/body.md

      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: /tmp/body.md
          files: release/*
          draft: true
