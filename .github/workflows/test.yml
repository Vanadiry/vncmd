name: Test

permissions:
  contents: read

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install project
        run: uv sync --frozen --dev

      # ruff 不在 dev 组里，它只用来做格式化与静态检查，不参与运行
      - name: Install linter
        run: uv tool install ruff

      - name: Check formatting
        run: uvx ruff format --check .

      - name: Lint
        run: uvx ruff check .

      # 刻意不设 TZ：发行时间固定按 Asia/Shanghai 算，测试用 as_tz 把进程
      # 时区切成 UTC，验证结果不受本机时区影响。runner 默认就是 UTC，
      # 任何误用本地时区的写法都会当场暴露，而不是被固定的 TZ 变量掩盖过去。
      - name: Unit tests
        run: uv run pytest -m "not network" --cov=vncmd --cov-report=term-missing
