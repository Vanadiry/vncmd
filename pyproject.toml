[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "vncmd"
version = "0.4.1"
description = "NetEase Cloud Music CLI Tool — search, preview, download, and tracker."
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Vanadiry", email = "v@vanadiry.com"},
]
keywords = ["netease", "music", "download", "cli", "lyrics", "metadata"]
urls = {Repository = "https://github.com/Vanadiry/vncmd", Documentation = "https://magic.vanadiry.com/wiki/vncmd"}
dependencies = [
    "eyed3>=0.9.9",
    "filelock>=3.32.5",
    "mutagen>=1.48.1",
    "pillow>=12.3.0",
    "prompt-toolkit>=3.0.53",
    "questionary>=2.1.1",
    "requests>=2.34.2",
    "rich>=15.0.0",
]

[project.scripts]
vncmd = "vncmd:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "twine>=7.0.0",
]

[tool.setuptools]
py-modules = ["vncmd"]
packages = ["function"]

[tool.ruff.lint.per-file-ignores]
"test/*" = ["E402"]

[tool.coverage.run]
source = ["function"]
omit = ["*/test/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    'if __name__ == "__main__":',
]
